[contracts.project_token_wallet]
display-name = "Project Token Wallet"
src = "contracts/launch/project-token/project_token_wallet.tolk"
depends = []

[contracts.token_launcher]
display-name = "Token Launcher"
src = "contracts/platform/infra/token-launcher/token_launcher.tolk"
