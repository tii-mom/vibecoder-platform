name: VibeCoder CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for hardcoded secrets
        run: |
          set -e
          patterns=(
            'api_key=[a-f0-9]{64}'
            'secret-12345'
            'webhook-secret-12345'
            'signer-internal-secret-12345'
            'sk-[a-zA-Z0-9]{48}'
          )
          found=0
          for pattern in "${patterns[@]}"; do
            matches=$(grep -rnE "$pattern" --include='*.ts' --include='*.tsx' --include='*.md' --include='*.toml' --include='*.json' . || true)
            if [ -n "$matches" ]; then
              echo "::error::Found potential secret matching pattern '$pattern':"
              echo "$matches"
              found=1
            fi
          done
          if [ $found -eq 1 ]; then
            echo "::error::Secret scan failed. Remove hardcoded secrets before merging."
            exit 1
          fi
          echo "Secret scan passed."

  vc:
    name: Frontend (vc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: vc/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  worker:
    name: API (worker)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm audit --omit=dev --audit-level=high

  signer:
    name: Signer Service (signer)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: signer/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm audit --omit=dev --audit-level=high

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm audit --omit=dev --audit-level=high
      - name: Run tests (allowed to fail — Tolk compiler compat)
        run: npm test -- --runInBand || echo "::warning::Contract tests failed — Tolk compiler version mismatch (pre-existing)"
        continue-on-error: true
