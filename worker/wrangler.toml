name = "vibecoder-api"
main = "src/index.ts"
compatibility_date = "2024-02-22"
account_id = "YOUR_CLOUDFLARE_ACCOUNT_ID"

[[d1_databases]]
binding = "DB"
database_name = "vibecoder-db-new"
database_id = "YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
# TONCENTER_API_KEY must be configured as a Wrangler secret:
#   wrangler secret put TONCENTER_API_KEY
TON_NETWORK = "testnet"

routes = [
  "api.72h.lol/*",
]
